name: Release Core
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
      - uses: anchore/sbom-action/download-syft@v0
      - uses: sigstore/cosign-installer@v4
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign checksum manifest keylessly
        run: cosign sign-blob --yes dist/checksums.txt --bundle dist/checksums.txt.sigstore.json
      - name: Attach signature bundle
        run: gh release upload "$GITHUB_REF_NAME" dist/checksums.txt.sigstore.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
